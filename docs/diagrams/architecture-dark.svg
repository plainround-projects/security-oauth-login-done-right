<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="t d">
<title id="t">Sign-in with the code flow and PKCE</title>
<desc id="d">A browser sends GET /login and GET /callback to the Flask app, which runs inside one gunicorn process with 1 worker and 8 threads and hands the work to LoginService. The browser is redirected to Keycloak, realm demo, where the user types a password, and is redirected back with a code. LoginService posts the code, verifier and secret to the token endpoint, receives the ID, access and refresh tokens, and checks signatures against the JWKS. Tokens stay in the session store; the browser gets only opaque cookies. Two amber notes name what is refused: a callback with the wrong state or from another browser, and a forged or wrong token.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="849" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="848" rx="16"/>
<text class="title" x="48" y="68">Sign-in with the code flow and PKCE</text>
<text class="caption" x="48" y="100">Tokens stay on the server; the browser holds two opaque cookies. Amber: what the app refuses.</text>

<rect class="actor" x="48" y="176" width="200" height="72" rx="36"/>
<text class="name" x="148" y="208" text-anchor="middle">Browser</text>
<text class="sub" x="148" y="230" text-anchor="middle">opaque cookies only</text>

<rect class="boundary" x="832" y="132" width="320" height="172" rx="14"/>
<text class="tag" x="848" y="156">Identity provider</text>
<rect class="svc" x="852" y="176" width="280" height="96" rx="12"/>
<text class="name" x="868" y="208">Keycloak</text>
<text class="sub" x="868" y="232">realm demo</text>
<text class="sub" x="868" y="254">start-dev, in a container</text>

<rect class="boundary" x="360" y="292" width="304" height="472" rx="14"/>
<text class="tag" x="376" y="320">gunicorn: 1 worker, 8 threads</text>
<rect class="svc" x="384" y="332" width="256" height="84" rx="12"/>
<text class="name" x="400" y="364">Flask app</text>
<text class="sub" x="400" y="388">interfaces/http</text>
<text class="sub" x="400" y="410">cookies, headers</text>
<rect class="svc" x="384" y="456" width="256" height="140" rx="12"/>
<text class="name" x="400" y="488">LoginService</text>
<text class="sub" x="400" y="512">application + domain</text>
<text class="sub" x="400" y="534">OidcProvider (httpx)</text>
<text class="sub" x="400" y="556">JwksTokenVerifier (PyJWT)</text>
<path class="store" d="M384 628a128 12 0 0 1 256 0v98a128 12 0 0 1 -256 0z"/>
<path class="rim" d="M384 628a128 12 0 0 0 256 0"/>
<text class="name" x="512" y="660" text-anchor="middle">Session store</text>
<text class="sub" x="512" y="682" text-anchor="middle">tokens stay here</text>
<text class="sub" x="512" y="704" text-anchor="middle">SHA-256 of the cookie</text>

<rect class="actor" x="984" y="620" width="168" height="72" rx="36"/>
<text class="name" x="1068" y="652" text-anchor="middle">user</text>
<text class="sub" x="1068" y="674" text-anchor="middle">types a password</text>

<rect class="note" x="48" y="436" width="280" height="96" rx="10"/>
<text class="label b t-warn" x="64" y="464">login CSRF, replay</text>
<text class="sub" x="64" y="488">StateMismatchError: 400,</text>
<text class="sub" x="64" y="510">no call to the provider</text>
<rect class="note" x="48" y="562" width="280" height="118" rx="10"/>
<text class="label b t-warn" x="64" y="590">forged or wrong token</text>
<text class="sub" x="64" y="614">alg none, bad signature,</text>
<text class="sub" x="64" y="636">wrong audience or nonce:</text>
<text class="sub" x="64" y="658">refused, no session</text>

<path class="sync" d="M248 200H852"/>
<text class="label t-accent" x="264" y="188">3 authorize: state, nonce, S256 challenge</text>
<path class="ok" d="M852 232H248"/>
<text class="label t-good" x="264" y="256">5 302 redirect_uri?code&amp;state</text>
<path class="sync" d="M124 248V384Q124 396 136 396H384"/>
<text class="label t-accent" x="196" y="416">/login, /callback</text>
<path class="ok" d="M384 366H184Q172 366 172 354V248"/>
<text class="label t-good" x="196" y="354">302 + cookies</text>
<path class="sync" d="M512 416V456"/>
<path class="sync" d="M512 596V616"/>
<path class="sync" d="M640 480H892Q904 480 904 468V272"/>
<text class="label t-accent" x="676" y="452">7 POST token endpoint</text>
<text class="label t-accent" x="676" y="500">code + verifier + secret</text>
<path class="ok" d="M968 272V528Q968 540 956 540H640"/>
<text class="label t-good" x="676" y="528">8 ID, access, refresh tokens</text>
<path class="read" d="M1032 272V560Q1032 572 1020 572H640"/>
<text class="label" x="676" y="560">9 JWKS: signing keys</text>
<path class="async" d="M1100 620V272"/>
<text class="label t-accent" x="1088" y="604" text-anchor="end">4 password, at the provider only</text>
<path class="fail" d="M384 476H328"/>
<path class="fail" d="M384 585H328"/>

<path class="sync" d="M48 806H112"/><text class="legend" x="124" y="811">sync call</text>
<path class="async" d="M264 806H328"/><text class="legend" x="340" y="811">async message</text>
<path class="read" d="M520 806H584"/><text class="legend" x="596" y="811">read</text>
<path class="fail" d="M696 806H760"/><text class="legend" x="772" y="811">failure path</text>
<path class="ok" d="M928 806H992"/><text class="legend" x="1004" y="811">result</text>
</svg>
